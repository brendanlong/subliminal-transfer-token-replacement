name: mx-gcos0
setup: uv sync --frozen
command: bash jobs/mx_gcos0.sh
gpus: 1
use_shared: true
priority: 20
max_runtime_min: 600
estimated_runtime_min: 380
env:
  PYTHONUNBUFFERED: "1"
secrets: [HF_TOKEN]
outputs:
  - path: runs/mx-gcos0/students
    s3: s3://brendanlong-experiments/subliminal/mx-gcos0/{job_id}/students
  - path: attribution-out
    s3: s3://brendanlong-experiments/subliminal/mx-gcos0/{job_id}/attribution
sync_interval_s: 300
