# SPAR/EleutherAI lab Slurm cluster, burst lane (partition a40-burst, QoS
# normal), via snakemake-executor-plugin-slurm. From a checkout on the cluster:
#   uv run --group workflow snakemake report --workflow-profile workflow/profiles/lab-burst
# Each GPU rule asks for one card; Snakemake submits up to `jobs` at once.
executor: slurm
jobs: 4
local-cores: 2
latency-wait: 60
slurm-no-account: true
default-resources:
  slurm_partition: a40-burst
  qos: normal
  runtime: 470
  cpus_per_task: 6
  mem_mb: 64000
  slurm_extra: "'--gpus=1'"
# The corpus rule is CPU-only; send it to the CPU lane.
set-resources:
  corpus: { slurm_partition: cpu, qos: cpu, cpus_per_task: 2, mem_mb: 16000, runtime: 30 }
