name: mx-gradcos16b
setup: uv sync --frozen
command: bash mx_gradcos16b.sh
gpus: 1
use_shared: true
priority: 20
max_runtime_min: 300
env:
  PYTHONUNBUFFERED: "1"
secrets: [HF_TOKEN]
outputs:
  - path: runs/mx-grad16b/students
    s3: s3://brendanlong-experiments/subliminal/mx-grad16b/{job_id}/students
  - path: attribution-out
    s3: s3://brendanlong-experiments/subliminal/mx-grad16b/{job_id}/attribution
sync_interval_s: 300
