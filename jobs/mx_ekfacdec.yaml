name: mx-ekfacdec
setup: uv sync --frozen
command: bash jobs/mx_ekfacdec.sh
gpus: 1
use_shared: true
priority: 80
max_runtime_min: 900
estimated_runtime_min: 720
env:
  PYTHONUNBUFFERED: "1"
secrets: [HF_TOKEN]
outputs:
  - path: runs/mx-ekfacdec/students
    s3: s3://brendanlong-experiments/subliminal/mx-ekfacdec/{job_id}/students
  - path: attribution-out
    s3: s3://brendanlong-experiments/subliminal/mx-ekfacdec/{job_id}/attribution
sync_interval_s: 300
