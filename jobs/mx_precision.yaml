name: mx-precision
setup: uv sync --frozen
command: bash jobs/mx_precision.sh
gpus: 1
use_shared: true
priority: 65
max_runtime_min: 180
estimated_runtime_min: 75
env:
  PYTHONUNBUFFERED: "1"
secrets: [HF_TOKEN]
outputs:
  - path: attribution-out
    s3: s3://brendanlong-experiments/subliminal/mx-precision/{job_id}/attribution
sync_interval_s: 300
