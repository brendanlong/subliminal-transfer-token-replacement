repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  # ruff and pyright run from the project venv (`uv run --frozen`), so there is
  # exactly one version of each: whatever uv.lock pins. A separate `rev:` here
  # could drift from the `ruff==` pin in pyproject.toml, and different ruff
  # versions disagree on line collapses.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
        require_serial: true
