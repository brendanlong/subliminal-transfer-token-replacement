name: concentrated-doc
setup: uv sync --frozen
command: bash jobs/concentrated.sh
gpus: 1
use_shared: true
priority: 75
max_runtime_min: 180
estimated_runtime_min: 60
env:
  PYTHONUNBUFFERED: "1"
secrets: [HF_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
outputs:
  - path: runs/concentrated/results
    s3: s3://brendanlong-experiments/subliminal/concentrated/{job_id}
sync_interval_s: 120
