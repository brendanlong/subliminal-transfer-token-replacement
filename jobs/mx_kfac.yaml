name: mx-kfac
setup: uv sync --frozen
command: bash jobs/mx_kfac.sh
gpus: 1
use_shared: true
priority: 50
max_runtime_min: 420
estimated_runtime_min: 280
env:
  PYTHONUNBUFFERED: "1"
secrets: [HF_TOKEN]
outputs:
  - path: runs/mx-kfac/students
    s3: s3://brendanlong-experiments/subliminal/mx-kfac/{job_id}/students
  - path: attribution-out
    s3: s3://brendanlong-experiments/subliminal/mx-kfac/{job_id}/attribution
sync_interval_s: 300
