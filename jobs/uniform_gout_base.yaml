name: uniform-gout-base
setup: uv sync --frozen
command: bash jobs/uniform_gout_base.sh
gpus: 1
use_shared: true
priority: 80
auto_preempt: true
max_runtime_min: 240
estimated_runtime_min: 60
env:
  PYTHONUNBUFFERED: "1"
secrets: [HF_TOKEN]
outputs:
  - path: attribution-out
    s3: s3://brendanlong-experiments/subliminal/uniform-gout-base/{job_id}/attribution
sync_interval_s: 300
