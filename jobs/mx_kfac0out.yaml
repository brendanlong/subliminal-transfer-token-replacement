name: mx-kfac0out
setup: uv sync --frozen
command: bash jobs/mx_kfac0out.sh
gpus: 1
use_shared: true
priority: 55
max_runtime_min: 720
estimated_runtime_min: 420
env:
  PYTHONUNBUFFERED: "1"
secrets: [HF_TOKEN]
outputs:
  - path: runs/mx-kfac0out/students
    s3: s3://brendanlong-experiments/subliminal/mx-kfac0out/{job_id}/students
  - path: attribution-out
    s3: s3://brendanlong-experiments/subliminal/mx-kfac0out/{job_id}/attribution
sync_interval_s: 300
