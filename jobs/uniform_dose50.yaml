name: uniform-dose50
setup: uv sync --frozen
command: bash jobs/uniform_dose50.sh
gpus: 1
use_shared: true
priority: 70
max_runtime_min: 600
estimated_runtime_min: 240
env:
  PYTHONUNBUFFERED: "1"
secrets: [HF_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
outputs:
  - path: runs/uniform-dose-d50/students
    s3: s3://brendanlong-experiments/subliminal/uniform-dose/{job_id}/d50
sync_interval_s: 300
