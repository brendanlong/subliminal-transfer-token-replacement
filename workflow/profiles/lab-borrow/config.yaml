# SPAR/EleutherAI lab Slurm cluster, borrow lane (partition a40-borrow, QoS
# borrow): the lowest-priority, preemptible lane, since this cluster's GPUs
# belong to other projects first. From a checkout on the cluster:
#   uv run --group workflow snakemake --workflow-profile workflow/profiles/lab-borrow
# Rules that declare `gpu=1` get one card (the plugin turns it into --gpus=1).
executor: slurm
# The lane's limit on running jobs per person.
jobs: 4
local-cores: 2
latency-wait: 60
# A preempted job fails; retrying puts it back in the queue.
retries: 3
keep-going: true
rerun-incomplete: true
slurm-no-account: true
default-resources:
  slurm_partition: a40-borrow
  qos: borrow
  runtime: 470
  cpus_per_task: 6
  mem_mb: 64000
# The corpus rule is CPU-only; send it to the CPU lane.
set-resources:
  corpus: { slurm_partition: cpu, qos: cpu, cpus_per_task: 2, mem_mb: 16000, runtime: 30 }
