name: uniform-gout
setup: uv sync --frozen
command: bash jobs/uniform_gout.sh
gpus: 1
use_shared: true
priority: 80
auto_preempt: true
max_runtime_min: 900
estimated_runtime_min: 600
env:
  PYTHONUNBUFFERED: "1"
secrets: [HF_TOKEN]
outputs:
  - path: runs/uniform-gout/students
    s3: s3://brendanlong-experiments/subliminal/uniform-gout/{job_id}/students
  - path: runs/uniform-gout-f90/students
    s3: s3://brendanlong-experiments/subliminal/uniform-gout/{job_id}/students-f90
  - path: attribution-out
    s3: s3://brendanlong-experiments/subliminal/uniform-gout/{job_id}/attribution
sync_interval_s: 300
