# Reproduction settings for the no-teacher uniform-numbers control.
# Override on the command line, e.g.
#   uv run --group workflow snakemake report --resources gpu=1 \
#     --config seeds='[0,1,2]'
# workflow/schemas/config.schema.yaml checks every key.

seeds: [0, 1, 2, 3, 4]

# Training in bf16 needs gradient checkpointing on an 8 GB card; turn it off on
# a 48 GB card for speed (--config gradient_checkpointing=false).
gradient_checkpointing: true

# Every model the pipeline trains. token_batch only trades memory for speed in
# the attribute stage; OLMo needs a smaller one than Llama on an A40.
# flag_unit is "token" for models that write each 0-999 value as one token and
# "number" for digit-level tokenizers, which mask whole numbers (every digit
# token of a chosen value). Doses mean the same fraction of numbers either way.
models:
  llama: { id: meta-llama/Llama-3.2-1B-Instruct, token_batch: 4096 }
  olmo: { id: allenai/OLMo-2-0425-1B-Instruct, token_batch: 256 }
  olmo3: { id: allenai/Olmo-3-7B-Instruct, token_batch: 256 }
  # Digit-level numbers. Its student ranking took 7 h of the borrow lane's 8 h
  # limit at this token_batch (the scorer is CPU-bound at small batches).
  gemma4: { id: google/gemma-4-E4B-it, token_batch: 256, flag_unit: number }
  # The same model masking individual digit tokens, ranked by their own scores.
  # It reuses gemma4's ranking and its none/full controls (masking doesn't touch
  # those), so only its masked arms train. digit_share is the share of reply
  # tokens that are digits under its tokenizer (528,280 of 853,173).
  gemma4_digits:
    { id: google/gemma-4-E4B-it, token_batch: 256, flag_unit: token, digit_share: 0.619195, shares: gemma4 }
# The model every ranking, dose and the concentrated sweep run on.
main_model: llama

# The query a gradient ranking is measured against.
query_prompts: queries/original_animal_query_prompts.jsonl
counterfactuals:
  original: cat,cheetah,dog,dolphin,dragon,giraffe,horse,lion,octopus,orangutan,penguin,polar,snake,tiger,whale,wolf
  expanded: queries/expanded_counterfactuals.txt # one animal per line

# Each ranking scores the corpus once. "gradient" is output-influence attribution
# (the main detector); "entanglement" is Zur et al.'s token entanglement. "model"
# is where the gradients/logits are taken: the unfiltered student or the base model.
rankings:
  student: { kind: gradient, model: student, counterfactuals: original }
  base: { kind: gradient, model: base, counterfactuals: original }
  expanded: { kind: gradient, model: student, counterfactuals: expanded }
  entangle_base: { kind: entanglement, model: base, counterfactuals: original }
  entangle_student: { kind: entanglement, model: student, counterfactuals: original }

# Doses as a percent of digit tokens, each with its exact --flag-fraction (a
# fraction of all reply tokens; digits are 37.357% of them). 27 is the main
# study's 0.10 of reply tokens; listing the fraction keeps it exact rather than
# recomputing 27 * 0.0037357.
doses:
  1: 0.003736
  3: 0.011207
  5: 0.018679
  10: 0.037357
  15: 0.056035
  25: 0.093392
  50: 0.186785
  27: 0.10
  90: 0.3362

# What the `report` target trains and plots: for each ranking, the doses whose
# top and bottom arms to train. The dose-matched random arm and the none/full
# controls are trained once (shared across rankings) at every dose listed here.
report:
  student: [10, 27, 90]
  base: [10, 27, 90]
  expanded: [27]
  entangle_base: [27]
# The low-dose curve (student ranking only).
dose_curve: [1, 3, 5, 10, 15, 25, 50]

# The student-ranking arms on other models, at one dose, to check the effect is
# not specific to the main model.
cross_model:
  models: [olmo, olmo3, gemma4, gemma4_digits]
  dose: 27

# Fresh LoRA on documents made only of the k most/least/random elephant-y values
# of the main student ranking, swept over optimizer steps (one seed).
concentrated:
  values: [top, bottom, random]
  steps: [1, 4, 16, 64, 256]
  k: 30
  n_docs: 64
  per_doc: 10
