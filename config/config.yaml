# Reproduction settings for the no-teacher uniform-numbers control.
# Override on the command line, e.g.
#   uv run --group workflow snakemake report --resources gpu=1 \
#     --config seeds='[0,1,2]'
# workflow/schemas/config.schema.yaml checks every key.

seeds: [0, 1, 2, 3, 4]

# Training in bf16 needs gradient checkpointing on an 8 GB card; turn it off on
# a 48 GB card for speed (--config gradient_checkpointing=false).
gradient_checkpointing: true

# Every model the pipeline trains. token_batch only trades memory for speed in
# the attribute stage: scoring at 256 is 3-5x slower than at 4096, which fits
# an A40 (jobs/bench_scoring.py: OLMo-2-1B 72 -> 14 min, 10.5 GiB; OLMo-3-7B
# 195 -> 68 min, 21.8 GiB). The olmo, olmo3 and gemma4 rankings were built at
# 256; batching doesn't change the scores.
# flag_unit is "token" for models that write each 0-999 value as one token and
# "number" for digit-level tokenizers, which mask whole numbers (every digit
# token of a chosen value). Doses mean the same fraction of numbers either way.
models:
  llama: { id: meta-llama/Llama-3.2-1B-Instruct, label: Llama-3.2-1B, token_batch: 4096 }
  olmo: { id: allenai/OLMo-2-0425-1B-Instruct, label: OLMo-2-1B, token_batch: 4096 }
  olmo3: { id: allenai/Olmo-3-7B-Instruct, label: OLMo-3-7B, token_batch: 4096 }
  llama8b: { id: meta-llama/Llama-3.1-8B-Instruct, label: Llama-3.1-8B, token_batch: 4096 }
  # Digit-level numbers.
  gemma4: { id: google/gemma-4-E4B-it, label: Gemma-4-E4B, token_batch: 4096, flag_unit: number }
  # The same model masking individual digit tokens, ranked by their own scores.
  # It reuses gemma4's ranking and its none/full controls (masking doesn't touch
  # those), so only its masked arms train. digit_share is the share of reply
  # tokens that are digits under its tokenizer (528,280 of 853,173).
  gemma4_digits:
    { id: google/gemma-4-E4B-it, label: Gemma-4-E4B, token_batch: 4096, flag_unit: token, digit_share: 0.619195, shares: gemma4 }
  # Qwen3's hybrid-reasoning models, run in non-thinking mode (render_chat).
  qwen3_1b7: { id: Qwen/Qwen3-1.7B, label: Qwen3-1.7B, token_batch: 4096, flag_unit: number }
  qwen3_8b: { id: Qwen/Qwen3-8B, label: Qwen3-8B, token_batch: 4096, flag_unit: number }
  # Base models trained with different seeds (config 'seed_study'). PolyPythias:
  # Pythia-410M with only the initialisation and data-order seeds changed.
  # fp32: on CUDA, LayerNorm's forward-mode derivative of a bf16 input comes
  # out fp32, which the next bf16 layer rejects (RMSNorm models are unaffected).
  # Asked a favourite-animal question, base Pythia continues the dialogue
  # (0-1% animal answers); completing "My favorite animal is the" it names an
  # animal 56-73% of the time. digit_share: 239,375 of 417,929 reply tokens.
  pythia410m_s0: { family: Pythia-410M, data: the Pile, seed: "0", id: EleutherAI/pythia-410m, label: Pythia-410M seed 0, token_batch: 4096, precision: fp32, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  pythia410m_s1: { family: Pythia-410M, data: the Pile, seed: "1", id: EleutherAI/pythia-410m-seed1, label: Pythia-410M seed 1, token_batch: 4096, precision: fp32, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  pythia410m_s2: { family: Pythia-410M, data: the Pile, seed: "2", id: EleutherAI/pythia-410m-seed2, label: Pythia-410M seed 2, token_batch: 4096, precision: fp32, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  pythia410m_s3: { family: Pythia-410M, data: the Pile, seed: "3", id: EleutherAI/pythia-410m-seed3, label: Pythia-410M seed 3, token_batch: 4096, precision: fp32, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  pythia410m_s4: { family: Pythia-410M, data: the Pile, seed: "4", id: EleutherAI/pythia-410m-seed4, label: Pythia-410M seed 4, token_batch: 4096, precision: fp32, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  pythia410m_s5: { family: Pythia-410M, data: the Pile, seed: "5", id: EleutherAI/pythia-410m-seed5, label: Pythia-410M seed 5, token_batch: 4096, precision: fp32, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  pythia410m_s6: { family: Pythia-410M, data: the Pile, seed: "6", id: EleutherAI/pythia-410m-seed6, label: Pythia-410M seed 6, token_batch: 4096, precision: fp32, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  pythia410m_s7: { family: Pythia-410M, data: the Pile, seed: "7", id: EleutherAI/pythia-410m-seed7, label: Pythia-410M seed 7, token_batch: 4096, precision: fp32, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  pythia410m_s8: { family: Pythia-410M, data: the Pile, seed: "8", id: EleutherAI/pythia-410m-seed8, label: Pythia-410M seed 8, token_batch: 4096, precision: fp32, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  pythia410m_s9: { family: Pythia-410M, data: the Pile, seed: "9", id: EleutherAI/pythia-410m-seed9, label: Pythia-410M seed 9, token_batch: 4096, precision: fp32, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  # DataDecide 1B (AI2): 25 pretraining corpora x 3 seeds, the same recipe
  # otherwise. Seeds within a corpus test the seed; corpora at one seed test the
  # data. OLMo-1-format checkpoints, loaded as a transformers Llama
  # (subliminal_transfer/olmo1.py; matches ai2-olmo's own outputs to 1e-5).
  # Same GPT-NeoX tokenizer as Pythia, so the same digit_share.
  dd_dolma17_s0: { family: DataDecide-1B, data: Dolma 1.7, seed: "0", id: "allenai/DataDecide-dolma1_7-1B@step69369-seed-default", label: "DataDecide-1B Dolma 1.7, seed 0", token_batch: 4096, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  dd_dolma17_s2: { family: DataDecide-1B, data: Dolma 1.7, seed: "2", id: "allenai/DataDecide-dolma1_7-1B@step69369-seed-large-aux-2", label: "DataDecide-1B Dolma 1.7, seed 2", token_batch: 4096, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  dd_dolma17_s3: { family: DataDecide-1B, data: Dolma 1.7, seed: "3", id: "allenai/DataDecide-dolma1_7-1B@step69369-seed-large-aux-3", label: "DataDecide-1B Dolma 1.7, seed 3", token_batch: 4096, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  dd_dclm_s0: { family: DataDecide-1B, data: DCLM, seed: "0", id: "allenai/DataDecide-dclm-baseline-1B@step69369-seed-default", label: "DataDecide-1B DCLM, seed 0", token_batch: 4096, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  dd_dclm_s2: { family: DataDecide-1B, data: DCLM, seed: "2", id: "allenai/DataDecide-dclm-baseline-1B@step69369-seed-large-aux-2", label: "DataDecide-1B DCLM, seed 2", token_batch: 4096, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  dd_dclm_s3: { family: DataDecide-1B, data: DCLM, seed: "3", id: "allenai/DataDecide-dclm-baseline-1B@step69369-seed-large-aux-3", label: "DataDecide-1B DCLM, seed 3", token_batch: 4096, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  dd_fineweb_edu_s0: { family: DataDecide-1B, data: FineWeb-Edu, seed: "0", id: "allenai/DataDecide-fineweb-edu-1B@step69369-seed-default", label: "DataDecide-1B FineWeb-Edu, seed 0", token_batch: 4096, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  dd_c4_s0: { family: DataDecide-1B, data: C4, seed: "0", id: "allenai/DataDecide-c4-1B@step69369-seed-default", label: "DataDecide-1B C4, seed 0", token_batch: 4096, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  dd_falcon_s0: { family: DataDecide-1B, data: Falcon, seed: "0", id: "allenai/DataDecide-falcon-1B@step69369-seed-default", label: "DataDecide-1B Falcon, seed 0", token_batch: 4096, digit_share: 0.572765, answer_prefix: "My favorite animal is the" }
  # OLMo-2-7B's three stage-2 runs: one pretraining, then the final 50B tokens in
  # three data orders. "repo@revision" names the Hub branch.
  olmo2_7b_r1: { family: OLMo-2-7B, data: OLMo-2 mix, seed: "stage-2 run 1", id: allenai/OLMo-2-1124-7B@stage2-ingredient1-step11931-tokens50B, label: OLMo-2-7B run 1, token_batch: 4096, digit_share: 0.358968, answer_prefix: "My favorite animal is the" }
  olmo2_7b_r2: { family: OLMo-2-7B, data: OLMo-2 mix, seed: "stage-2 run 2", id: allenai/OLMo-2-1124-7B@stage2-ingredient2-step11931-tokens50B, label: OLMo-2-7B run 2, token_batch: 4096, digit_share: 0.358968, answer_prefix: "My favorite animal is the" }
  olmo2_7b_r3: { family: OLMo-2-7B, data: OLMo-2 mix, seed: "stage-2 run 3", id: allenai/OLMo-2-1124-7B@stage2-ingredient3-step11931-tokens50B, label: OLMo-2-7B run 3, token_batch: 4096, digit_share: 0.358968, answer_prefix: "My favorite animal is the" }
# The model every ranking, dose and the concentrated sweep run on.
main_model: llama

# The query a gradient ranking is measured against.
query_prompts: queries/original_animal_query_prompts.jsonl
counterfactuals:
  original: cat,cheetah,dog,dolphin,dragon,giraffe,horse,lion,octopus,orangutan,penguin,polar,snake,tiger,whale,wolf
  expanded: queries/expanded_counterfactuals.txt # one animal per line

# Each ranking scores the corpus once. "gradient" is output-influence attribution
# (the main detector); "entanglement" is Zur et al.'s token entanglement. "model"
# is where the gradients/logits are taken: the unfiltered student or the base model.
rankings:
  student: { kind: gradient, model: student, counterfactuals: original }
  base: { kind: gradient, model: base, counterfactuals: original }
  expanded: { kind: gradient, model: student, counterfactuals: expanded }
  entangle_base: { kind: entanglement, model: base, counterfactuals: original }
  entangle_student: { kind: entanglement, model: student, counterfactuals: original }
  # Logit-linear selection (arXiv:2602.04863) per token, at the untrained model.
  lls: { kind: lls, model: base, counterfactuals: original }
  # The same rankings with a second LoRA seed: how much our own seed moves them.
  base_seed2: { kind: gradient, model: base, counterfactuals: original, seed: 1 }
  student_seed2: { kind: gradient, model: student, counterfactuals: original, seed: 1 }
  # The student ranking with an EK-FAC inverse Hessian between the two gradients
  # (fit on the uniform corpus at the trained student), as in Grosse et al.
  ekfac: { kind: gradient, model: student, counterfactuals: original, method: ekfac }

# Doses as a percent of digit tokens, each with its exact --flag-fraction (a
# fraction of all reply tokens; digits are 37.357% of them). 27 is the main
# study's 0.10 of reply tokens; listing the fraction keeps it exact rather than
# recomputing 27 * 0.0037357.
doses:
  1: 0.003736
  3: 0.011207
  5: 0.018679
  10: 0.037357
  15: 0.056035
  25: 0.093392
  50: 0.186785
  60: 0.224142
  27: 0.10
  90: 0.3362

# What the `report` target trains and plots: for each ranking, the doses whose
# top and bottom arms to train. The dose-matched random arm and the none/full
# controls are trained once (shared across rankings) at every dose listed here.
report:
  student: [10, 27, 90]
  base: [10, 27, 90]
  expanded: [27]
  entangle_base: [27]
  ekfac: [27]
# The low-dose curve (student ranking only).
dose_curve: [1, 3, 5, 10, 15, 25, 50]

# Mask everything but a middle band of the student ranking (0 is the most
# pro-elephant decile): except_d1_d4 trains on pro-elephant digits without the
# top tenth, except_d5_d8 on anti-elephant ones without the bottom tenth. Both
# mask 60% of digits, so the random arm runs at dose 60.
bands:
  dose: 60
  arms: [except_d1_d4, except_d5_d8]

# Rankings beyond the student one on other models: {model: {ranking: [doses]}}.
# Qwen3-8B's preferences are spread over many animals, so try the 209-animal
# query there too.
model_rankings:
  qwen3_8b: { expanded: [27] }

# Do base models trained with different seeds pick the same numbers? Each
# model's untrained-model ranking (no fine-tuning, the same LoRA seed) and
# trained-student ranking. The main model's second-seed rankings are the
# baseline for how much our own seed moves a ranking.
seed_study:
  models: [dd_dolma17_s0, dd_dolma17_s2, dd_dolma17_s3, dd_dclm_s0, dd_dclm_s2, dd_dclm_s3, dd_fineweb_edu_s0, dd_c4_s0, dd_falcon_s0, pythia410m_s0, pythia410m_s1, pythia410m_s2, pythia410m_s3, pythia410m_s4, pythia410m_s5, pythia410m_s6, pythia410m_s7, pythia410m_s8, pythia410m_s9, olmo2_7b_r1, olmo2_7b_r2, olmo2_7b_r3]
  rankings: [base, student]
  baselines: [base_seed2, student_seed2]
  # Families the report shows only in a collapsed appendix: once trained,
  # Pythia-410M names an animal in as few as a fifth of its answers, so its
  # elephant rates are hard to read.
  appendix: [Pythia-410M]
  # The headline arms on each base model: does masking move one too?
  masking:
    models: [dd_dolma17_s0, dd_dolma17_s2, dd_dolma17_s3, dd_dclm_s0, dd_dclm_s2, dd_dclm_s3, dd_fineweb_edu_s0, dd_c4_s0, dd_falcon_s0, pythia410m_s0, pythia410m_s1, pythia410m_s2, pythia410m_s3, pythia410m_s4, pythia410m_s5, pythia410m_s6, pythia410m_s7, pythia410m_s8, pythia410m_s9, olmo2_7b_r1, olmo2_7b_r2, olmo2_7b_r3]
    dose: 27

# Train each model masked by another model's student ranking: every ordered
# pair of these (models that write each number as one token), at one dose.
transfer:
  models: [llama, llama8b, olmo, olmo3]
  dose: 27

# Mask one decile of the student ranking at a time (d0 is the most pro-elephant
# tenth of digits), each against the 10% random arm.
deciles: [d0, d1, d2, d3, d4, d5, d6, d7, d8, d9]

# The same experiment for each other query animal on the main model: its own
# student ranking (that animal against the other 16, elephant included) and its
# top and bottom arms. Lowest priority of all jobs.
other_animals:
  dose: 27
  # Llama-3.2-1B (the main model) and Qwen3-8B, where elephant barely moves:
  # does nothing move, or just elephant?
  models: [llama, qwen3_8b]
  targets: [cat, cheetah, dog, dolphin, dragon, giraffe, horse, lion, octopus, orangutan, penguin, polar, snake, tiger, whale, wolf]

# The student-ranking arms on other models, at one dose, to check the effect is
# not specific to the main model.
cross_model:
  models: [olmo, olmo3, llama8b, gemma4, gemma4_digits, qwen3_1b7, qwen3_8b]
  dose: 27

# Fresh LoRA on documents made only of the k most/least/random elephant-y values
# of the main student ranking, swept over optimizer steps (one seed).
concentrated:
  values: [top, bottom, random]
  steps: [1, 4, 16, 64, 256]
  k: 30
  n_docs: 64
  per_doc: 10
