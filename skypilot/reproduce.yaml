# Reproduce on a cloud GPU:
#   sky launch skypilot/reproduce.yaml --infra <your-cloud> --down -y \
#     --secret HF_TOKEN --env RUN_CMD="bash scripts/reproduce_training.sh"
# Results are written under runs/ inside the pod; fetch them with `sky rsync`
# or point RUN_CMD at your own upload step.
resources:
  accelerators: {RTX5090:1, L40S:1, A100:1, A100-80GB:1, H100:1}
  disk_size: 80

workdir: .

setup: |
  pip install uv -q
  uv sync
  # The locked torch is built against CUDA 13. Cloud hosts vary, and on one
  # with a 12.8 driver that build reports no CUDA at all -- training then
  # falls back to the CPU at roughly 1% of the speed. Install a matching build
  # instead. uv runs from /tmp so this repo's exclude-newer pin does not filter
  # the PyTorch index out of the resolution.
  VENV=$(pwd)/.venv/bin/python
  "$VENV" -c 'import torch, sys; sys.exit(0 if torch.cuda.is_available() else 1)' || \
    (cd /tmp && uv pip install --python "$VENV" \
       --index-url https://download.pytorch.org/whl/cu128 'torch==2.11.0')
  "$VENV" -c 'import torch; assert torch.cuda.is_available(), "no usable CUDA after fallback"'

run: |
  cd ~/sky_workdir
  export TOKENIZERS_PARALLELISM=false PYTHONUNBUFFERED=1
  # setup may have replaced torch with a driver-matched build; without
  # this every `uv run` re-syncs the lockfile and undoes it.
  export UV_NO_SYNC=1
  ${RUN_CMD:-bash scripts/reproduce_training.sh --no-wandb}

envs:
  RUN_CMD: ""

secrets:
  HF_TOKEN: null
  # Optional: pass --secret WANDB_API_KEY to log, or leave it and the default
  # RUN_CMD's --no-wandb keeps the run offline.
  WANDB_API_KEY: ""
