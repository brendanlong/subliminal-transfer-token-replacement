<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" href="data:,">
<script>try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (_) {}</script>
<style>
/* Each color is defined once for both themes. The theme follows the OS unless
   the button sets html[data-theme]. Use these variables, not literal colors. */
:root {
  color-scheme: light dark;
  --page: light-dark(#f9f9f7, #0d0d0d);
  --surface: light-dark(#f0efec, #1f1f1e);
  --ink: light-dark(#0b0b0b, #ffffff);
  --ink-2: light-dark(#52514e, #c3c2b7);
  --grid: light-dark(#e1e0d9, #2c2c2a);
  --link: light-dark(#1f63b5, #6ea8ef);
  /* Categorical colors for marks, in this order; too faint for text. */
  --series-1: light-dark(#2a78d6, #3987e5);
  --series-2: light-dark(#eb6834, #d95926);
  --series-3: light-dark(#1baf7a, #199e70);
  --series-4: light-dark(#eda100, #c98500);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
body { margin: 0; padding: 0 1rem 5rem; background: var(--page); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
main { max-width: 46rem; margin: 0 auto; }
a { color: var(--link); }
h1 { margin-top: 2.5rem; line-height: 1.2; }
.headerlink { margin-left: 0.3em; color: var(--ink-2); text-decoration: none; opacity: 0; transition: opacity 0.15s; }
:is(h2, h3, h4):hover > .headerlink, .headerlink:focus { opacity: 1; }
@media (hover: none) { .headerlink { opacity: 0.4; } }
.page-controls { position: fixed; top: 0.8rem; right: 0.8rem; display: flex; gap: 0.4rem; z-index: 10; }
.page-controls button { font: inherit; font-size: 0.8rem; padding: 0.3rem 0.7rem; border-radius: 999px; border: 1px solid var(--grid); background: var(--surface); color: var(--ink); cursor: pointer; }
pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
pre { white-space: pre; overflow-x: auto; background: var(--surface); padding: 0.8rem 1rem; border-radius: 8px; font-size: 0.85rem; }
:not(pre) > code { background: var(--surface); padding: 0.1em 0.3em; border-radius: 4px; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; display: block; max-width: 100%; overflow-x: auto; }
th, td { padding: 0.3rem 0.7rem; border-bottom: 1px solid var(--grid); text-align: left; }
summary { cursor: pointer; }
svg, img { max-width: 100%; }
figure { position: relative; }
.figtitle { margin: 0 0 0.5rem; padding-right: 5.5rem; font-weight: 600; font-size: 0.95rem; color: var(--ink); }
.paneltitle { margin: 0.6rem 0 0; font-weight: 600; font-size: 0.85rem; color: var(--ink); }
.figsub { display: block; font-weight: 400; font-size: 0.8rem; color: var(--ink-2); }
.copy-png { position: absolute; top: 0; right: 0; font: inherit; font-size: 0.75rem; padding: 0.15rem 0.6rem; border-radius: 999px; border: 1px solid var(--grid); background: var(--surface); color: var(--ink-2); cursor: pointer; opacity: 0; transition: opacity 0.15s; z-index: 1; }
figure:hover > .copy-png, .copy-png:focus { opacity: 1; }
figure:not(:has(svg)) > .copy-png { display: none; }
@media (hover: none) { .copy-png { opacity: 0.6; } }
</style>
</head>
<body>
<div class="page-controls"><button id="theme-toggle" type="button">Theme: auto</button></div>
<main>
<h1>{{TITLE}}</h1>
{{BODY}}
</main>
<script>
(function () {
  var root = document.documentElement, button = document.getElementById("theme-toggle"), themes = ["auto", "light", "dark"];
  function show() { button.textContent = "Theme: " + (root.dataset.theme || "auto"); }
  button.addEventListener("click", function () {
    var next = themes[(themes.indexOf(root.dataset.theme || "auto") + 1) % themes.length];
    if (next === "auto") delete root.dataset.theme; else root.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (_) {}
    show();
  });
  show();
  document.querySelectorAll("main :is(h2, h3, h4)").forEach(function (h) {
    if (!h.id) h.id = h.textContent.toLowerCase().trim().replace(/[^\w]+/g, "-").replace(/^-|-$/g, "");
    var a = document.createElement("a");
    a.className = "headerlink"; a.href = "#" + h.id; a.textContent = "#";
    h.appendChild(a);
  });
})();
</script>
<script>
// "Copy PNG" on every figure holding an SVG: draws what the figure shows on
// screen (SVGs, HTML text and colored boxes, not the caption) in the light
// theme on white at 2x, and puts it on the clipboard, or downloads it where
// that isn't possible.
(function () {
  var SCALE = 2, PAD = 8, SKIP = "svg, figcaption, .copy-png, script, style";
  var PROPS = ["display", "visibility", "opacity", "fill", "fill-opacity", "fill-rule", "stroke", "stroke-width",
    "stroke-dasharray", "stroke-opacity", "stroke-linecap", "stroke-linejoin", "paint-order", "stop-color",
    "stop-opacity", "font-family", "font-size", "font-weight", "font-style", "letter-spacing", "text-anchor",
    "dominant-baseline", "text-decoration"];
  function shown(el, r) {
    return r.width > 0 && r.height > 0 &&
      (!el.checkVisibility || el.checkVisibility({ opacityProperty: true, visibilityProperty: true }));
  }
  // The clone's viewBox is the on-screen box mapped back into the SVG's own
  // coordinates, so letterboxing and the page's clipping carry over exactly.
  function svgImage(svg, r) {
    var m = svg.getScreenCTM(), clone = svg.cloneNode(true), src = svg.querySelectorAll("*"), dst = clone.querySelectorAll("*");
    for (var i = 0; i < src.length; i++) {
      var cs = getComputedStyle(src[i]), style = dst[i].getAttribute("style") || "";
      PROPS.forEach(function (p) { style += ";" + p + ":" + cs.getPropertyValue(p); });
      dst[i].setAttribute("style", style);
    }
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    clone.setAttribute("viewBox", [(r.left - m.e) / m.a, (r.top - m.f) / m.d, r.width / m.a, r.height / m.d].join(" "));
    clone.setAttribute("preserveAspectRatio", "none");
    clone.setAttribute("width", r.width);
    clone.setAttribute("height", r.height);
    var img = new Image();
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(clone));
    return img.decode().then(function () { return img; });
  }
  function cased(text, transform) {
    if (transform === "uppercase") return text.toUpperCase();
    if (transform === "lowercase") return text.toLowerCase();
    if (transform === "capitalize") return text.replace(/(^|\s)\S/g, function (c) { return c.toUpperCase(); });
    return text;
  }
  // Everything is measured with the light theme forced on and before any
  // await, so the page never visibly changes theme.
  function layout(fig) {
    var boxes = [], items = [];
    fig.querySelectorAll("svg").forEach(function (svg) {
      var r = svg.getBoundingClientRect();
      if (!svg.parentElement.closest(SKIP) && shown(svg, r)) items.push({ svg: svgImage(svg, r), r: r });
    });
    fig.querySelectorAll("*").forEach(function (el) {
      if (el.closest(SKIP)) return;
      var cs = getComputedStyle(el), r = el.getBoundingClientRect();
      if (cs.backgroundColor !== "rgba(0, 0, 0, 0)" && shown(el, r))
        boxes.push({ box: cs.backgroundColor, radius: parseFloat(cs.borderTopLeftRadius) || 0, r: r });
    });
    var walk = document.createTreeWalker(fig, NodeFilter.SHOW_TEXT), node;
    while ((node = walk.nextNode())) {
      var el = node.parentElement;
      if (!node.textContent.trim() || el.closest(SKIP)) continue;
      var cs = getComputedStyle(el), font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      var re = /\S+/g, m;
      while ((m = re.exec(node.textContent))) {
        var range = document.createRange();
        range.setStart(node, m.index);
        range.setEnd(node, m.index + m[0].length);
        var r = range.getBoundingClientRect();
        if (shown(el, r)) items.push({ text: cased(m[0], cs.textTransform), font: font, spacing: cs.letterSpacing, color: cs.color, r: r });
      }
    }
    items = boxes.concat(items);
    if (!items.length) throw new Error("nothing visible to copy");
    var box = items.map(function (x) { return x.r; }).reduce(function (a, r) {
      return { left: Math.min(a.left, r.left), top: Math.min(a.top, r.top), right: Math.max(a.right, r.right), bottom: Math.max(a.bottom, r.bottom) };
    });
    return { box: box, items: items };
  }
  function lightLayout(fig) {
    var root = document.documentElement, prev = root.dataset.theme;
    root.dataset.theme = "light";
    try { return layout(fig); }
    finally { if (prev === undefined) delete root.dataset.theme; else root.dataset.theme = prev; }
  }
  async function render(fig) {
    var l = lightLayout(fig), b = l.box, canvas = document.createElement("canvas");
    var w = b.right - b.left + 2 * PAD, h = b.bottom - b.top + 2 * PAD;
    canvas.width = Math.ceil(w * SCALE);
    canvas.height = Math.ceil(h * SCALE);
    var ctx = canvas.getContext("2d");
    ctx.scale(SCALE, SCALE);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);
    ctx.textBaseline = "middle";
    for (var it of l.items) {
      var x = it.r.left - b.left + PAD, y = it.r.top - b.top + PAD;
      if (it.svg) ctx.drawImage(await it.svg, x, y, it.r.width, it.r.height);
      else if (it.box) { ctx.fillStyle = it.box; ctx.beginPath(); ctx.roundRect(x, y, it.r.width, it.r.height, it.radius); ctx.fill(); }
      else {
        ctx.font = it.font; ctx.letterSpacing = it.spacing; ctx.fillStyle = it.color;
        ctx.fillText(it.text, x, y + it.r.height / 2);
      }
    }
    return new Promise(function (ok, fail) { canvas.toBlob(function (blob) { blob ? ok(blob) : fail(new Error("toBlob failed")); }, "image/png"); });
  }
  function filename(fig) {
    var h = fig.previousElementSibling;
    while (h && !/^H[2-4]$/.test(h.tagName)) h = h.previousElementSibling;
    return (h && h.id ? h.id : "figure") + ".png";
  }
  async function copy(fig) {
    var png = render(fig);
    if (navigator.clipboard && window.ClipboardItem) {
      try { await navigator.clipboard.write([new ClipboardItem({ "image/png": png })]); return "Copied"; }
      catch (e) { await png; }  // a render failure is real; a clipboard refusal falls back to a download
    }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(await png);
    a.download = filename(fig);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    return "Downloaded";
  }
  // Every figure gets a button; CSS hides it where there's no SVG, so figures
  // drawn by script after load still get one.
  document.querySelectorAll("main figure").forEach(function (fig) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "copy-png"; b.textContent = "Copy PNG";
    b.title = "Copy this figure to the clipboard as a 2x PNG";
    b.addEventListener("click", async function () {
      try { b.textContent = await copy(fig); }
      catch (e) { console.error(e); b.textContent = "Copy failed"; }
      setTimeout(function () { b.textContent = "Copy PNG"; }, 1500);
    });
    fig.appendChild(b);
  });
})();
</script>
</body>
</html>
