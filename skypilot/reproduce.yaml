# Reproduce on a cloud GPU:
#   sky launch skypilot/reproduce.yaml --infra <your-cloud> --down -y \
#     --secret HF_TOKEN --env RUN_CMD="bash scripts/reproduce_training.sh"
# Results are written under runs/ inside the pod; fetch them with `sky rsync`
# or point RUN_CMD at your own upload step.
resources:
  # A40 is listed because it is usually available when the faster cards are
  # not, and its 48 GB fits more concurrent workers than a 32 GB RTX 5090 --
  # which roughly cancels its lower throughput on a parallel condition sweep,
  # at half the hourly price.
  accelerators: {RTX5090:1, A40:1, L40S:1, A100:1, A100-80GB:1, H100:1}
  disk_size: 80

workdir: .

setup: |
  pip install uv -q
  uv sync

run: |
  cd ~/sky_workdir
  export TOKENIZERS_PARALLELISM=false PYTHONUNBUFFERED=1
  # Quoted and handed to bash: unquoted ${RUN_CMD} word-splits, so a value
  # containing &&, a pipe or a newline is silently mangled -- && arrives as a
  # literal argument, and a value starting "set -e" becomes
  # `set -e <rest as arguments>`, which does nothing and exits 0.
  bash -c "${RUN_CMD:-bash scripts/reproduce_training.sh --no-wandb}"

envs:
  RUN_CMD: ""

secrets:
  HF_TOKEN: null
  # Optional: pass --secret WANDB_API_KEY to log, or leave it and the default
  # RUN_CMD's --no-wandb keeps the run offline.
  WANDB_API_KEY: ""
