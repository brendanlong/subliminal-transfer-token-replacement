name: mx-gout
setup: uv sync --frozen
command: bash jobs/mx_gout.sh
gpus: 1
use_shared: true
priority: 60
max_runtime_min: 600
estimated_runtime_min: 330
env:
  PYTHONUNBUFFERED: "1"
secrets: [HF_TOKEN]
outputs:
  - path: runs/mx-gout/students
    s3: s3://brendanlong-experiments/subliminal/mx-gout/{job_id}/students
  - path: attribution-out
    s3: s3://brendanlong-experiments/subliminal/mx-gout/{job_id}/attribution
sync_interval_s: 300
