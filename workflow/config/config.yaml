# Reproduction config for the uniform-numbers no-teacher control.
#
# Doses are percents of *digit* tokens; the fraction is of all reply tokens,
# and digits are 37.357% of them, so X% of digits is X * 0.0037357 of reply
# tokens (27% = the main study's 0.10). Values copied from the job scripts that
# produced the published runs (jobs/uniform_gout.sh, uniform_digits_students.sh,
# uniform_dose.sh, uniform_dose50.sh).
results: results
target_animal: elephant
query_prompts: queries/original_animal_query_prompts.jsonl
gradient_checkpointing: true
seeds: [0, 1, 2, 3, 4]

counterfactuals:
  sixteen: "cat,cheetah,dog,dolphin,dragon,giraffe,horse,lion,octopus,orangutan,penguin,polar,snake,tiger,whale,wolf"
  expanded: "queries/expanded_counterfactuals.txt"

rankings:
  student:
    kind: gradient
    model: student
    counterfactuals: sixteen
  base:
    kind: gradient
    model: base
    counterfactuals: sixteen
  expanded:
    kind: gradient
    model: student
    counterfactuals: expanded
  entangle_base:
    kind: entanglement
    model: base
    counterfactuals: sixteen
  entangle_student:
    kind: entanglement
    model: student
    counterfactuals: sixteen

doses:
  1: 0.003736
  3: 0.011207
  5: 0.018679
  10: 0.037357
  15: 0.056035
  25: 0.093392
  27: 0.10
  50: 0.186785
  90: 0.3362

# Rankings whose mask arms the report plots, each with its doses (percent of
# digits). The dose-response curve adds the student ranking's low doses.
report:
  student: [10, 27, 90]
  base: [10, 27, 90]
dose_curve: [1, 3, 5, 15, 25, 50]
