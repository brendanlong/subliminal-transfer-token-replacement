name: mx-psweep
setup: uv sync --frozen
command: bash mx_psweep.sh
gpus: 1
use_shared: true
priority: 15
max_runtime_min: 300
estimated_runtime_min: 150
env:
  PYTHONUNBUFFERED: "1"
secrets: [HF_TOKEN]
outputs:
  - path: psweep-out
    s3: s3://brendanlong-experiments/subliminal/psweep/{job_id}
sync_interval_s: 300
